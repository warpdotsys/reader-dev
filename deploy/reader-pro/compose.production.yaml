services:
  reader-pro:
    # The release workflow supplies an immutable registry reference, including
    # its digest. Production must never rebuild an image from host files.
    image: ${READER_IMAGE:?READER_IMAGE must be an immutable image reference}
    container_name: reader-pro-restored
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      READER_APP_WORKDIR: /
      READER_SERVER_PORT: "8080"
      READER_APP_LICENSESERVERURL: https://license.medwarp.cn
      READER_APP_LICENSECHECKENABLED: "true"
      # The complete production image carries Camoufox itself.  Do not silently
      # fall back to a host-installed Chromium or a second WebView container.
      READER_APP_WEBVIEWRENDERER: camoufox
    volumes:
      - ./storage:/storage
      - ./logs:/logs
    ports:
      - "127.0.0.1:18088:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: "1gb"
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
