name: Java Kotlin CI

on:
  push:
    branches: [legacy]
  pull_request:
    branches: [legacy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Temurin JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean test bootJar --no-daemon --stacktrace
      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s build/libs/reader-4.0.7.jar
          sha256sum build/libs/reader-4.0.7.jar | tee build/libs/SHA256SUMS
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-pro-${{ github.sha }}
          path: |
            build/libs/reader-4.0.7.jar
            build/libs/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

