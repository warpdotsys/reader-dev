name: Java Kotlin CI

on:
  push:
    branches: [legacy]
  pull_request:
    branches: [legacy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Temurin JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-vue3/package-lock.json
      - name: Verify simple-web compatibility
        run: |
          node --check src/main/resources/simple-web/assets/js/context-path-20260923.js
          node scripts/test-simple-web-context-path.js
      - name: Build and test
        run: |
          npm ci --prefix web-vue3
          npm run build --prefix web-vue3
          npm test --prefix web-vue3
          chmod +x gradlew
          ./gradlew -PreaderWebUi=vue3 clean test bootJar --no-daemon --stacktrace
      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find build/libs -maxdepth 1 -type f -name 'reader-*.jar' -print -quit)
          test -n "$jar"
          test -s "$jar"
          sha256sum "$jar" | tee build/libs/SHA256SUMS
      # The JAR alone does not contain Chromium. Only the complete image is a
      # distributable product; release.yml publishes it with the JAR.
