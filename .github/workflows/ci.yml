name: Java Kotlin CI

on:
  push:
    branches: [legacy]
  pull_request:
    branches: [legacy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Temurin JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify simple-web compatibility
        run: |
          node --check src/main/resources/simple-web/assets/js/context-path-20260923.js
          node scripts/test-simple-web-context-path.js
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean test bootJar --no-daemon --stacktrace
      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s build/libs/reader-4.0.7.jar
          sha256sum build/libs/reader-4.0.7.jar | tee build/libs/SHA256SUMS
      # The JAR alone does not contain Chromium. Only the complete image is a
      # distributable product; release.yml publishes it with the JAR.
