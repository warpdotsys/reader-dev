name: Resume verified Reader release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable stable tag, such as v6.1.0
        required: true
        type: string
      source_run_id:
        description: Failed original stable release run; all source and pressure gates must have passed
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: reader-pro-production
  cancel-in-progress: false

jobs:
  verify-resume-inputs:
    name: Verify immutable source artifacts before resuming publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      revision: ${{ steps.verify.outputs.revision }}
      source-run: ${{ steps.verify.outputs.source-run }}
      ghcr-image: ${{ steps.verify.outputs.ghcr-image }}
      dockerhub-image: ${{ steps.verify.outputs.dockerhub-image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require every original source gate and forbid an already activated release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: python3 scripts/verify-release-resume-inputs.py --tag "$RELEASE_TAG" --source-run "$SOURCE_RUN" --output release-resume-inputs.json
      - name: Refuse a configured registry without reported push access before downloading images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          python3 scripts/check-registry-publish-access.py --output registry-access.json
          python3 -c 'import json; value=json.load(open("registry-access.json")); assert value["completed"] and value["observations"]["configured"]["push"] is True'
      - name: Preserve bounded recovery input and grant evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-resume-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-resume-inputs.json
            registry-access.json
          if-no-files-found: error
          retention-days: 90

  build-and-publish-images:
    name: Publish only the two verified native images and their manifest
    needs: verify-resume-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      RELEASE_TAG: ${{ needs.verify-resume-inputs.outputs.tag }}
      RELEASE_REVISION: ${{ needs.verify-resume-inputs.outputs.revision }}
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      ghcr-digest: ${{ steps.digest.outputs.ghcr-digest }}
      dockerhub-digest: ${{ steps.digest.outputs.dockerhub-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-resume-inputs.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-resume-inputs.outputs.source-run }}
          name: reader-release-jar-${{ needs.verify-resume-inputs.outputs.revision }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-resume-inputs.outputs.source-run }}
          pattern: reader-native-transfer-*-${{ needs.verify-resume-inputs.outputs.revision }}
          path: ${{ runner.temp }}/reader-native-transfers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-resume-inputs.outputs.source-run }}
          name: reader-tested-native-amd64-${{ needs.verify-resume-inputs.outputs.revision }}
          path: ${{ runner.temp }}/reader-native-import/amd64
      - name: Verify and load the smoke-tested amd64 image before any registry login
        run: bash scripts/import-native-release.sh amd64 '${{ needs.verify-resume-inputs.outputs.version }}' "$RELEASE_REVISION" dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-resume-inputs.outputs.source-run }}
          name: reader-tested-native-arm64-${{ needs.verify-resume-inputs.outputs.revision }}
          path: ${{ runner.temp }}/reader-native-import/arm64
      - name: Verify and load the smoke-tested arm64 image before any registry login
        run: bash scripts/import-native-release.sh arm64 '${{ needs.verify-resume-inputs.outputs.version }}' "$RELEASE_REVISION" dist
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Push the exact tested native images to both registries without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          ghcr='${{ needs.verify-resume-inputs.outputs.ghcr-image }}'
          dockerhub='${{ needs.verify-resume-inputs.outputs.dockerhub-image }}'
          version='${{ needs.verify-resume-inputs.outputs.version }}'
          for arch in amd64 arm64; do
            docker tag "reader-pro:camoufox-smoke-$arch" "$ghcr:v$version-$arch"
            docker tag "reader-pro:camoufox-smoke-$arch" "$dockerhub:v$version-$arch"
            docker push "$ghcr:v$version-$arch"
            docker push "$dockerhub:v$version-$arch"
            native_digest=$(docker buildx imagetools inspect "$ghcr:v$version-$arch" --format '{{.Manifest.Digest}}')
            [[ "$native_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$native_digest" = "$(docker buildx imagetools inspect "$dockerhub:v$version-$arch" --format '{{.Manifest.Digest}}')"
            printf '%s\n' "$native_digest" > "dist/NATIVE_DIGEST-$arch"
          done
      - name: Compose and verify the exact two-platform manifests in both registries
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          ghcr='${{ needs.verify-resume-inputs.outputs.ghcr-image }}:v${{ needs.verify-resume-inputs.outputs.version }}'
          dockerhub='${{ needs.verify-resume-inputs.outputs.dockerhub-image }}:v${{ needs.verify-resume-inputs.outputs.version }}'
          amd_digest=$(cat dist/NATIVE_DIGEST-amd64)
          arm_digest=$(cat dist/NATIVE_DIGEST-arm64)
          docker buildx imagetools create --tag "$ghcr" "${ghcr%:*}@$amd_digest" "${ghcr%:*}@$arm_digest"
          docker buildx imagetools create --tag "$dockerhub" "${dockerhub%:*}@$amd_digest" "${dockerhub%:*}@$arm_digest"
          docker buildx imagetools inspect "$ghcr" --raw > dist/GHCR_IMAGE_INDEX.json
          docker buildx imagetools inspect "$dockerhub" --raw > dist/DOCKERHUB_IMAGE_INDEX.json
          node scripts/verify-release-manifest.mjs dist/GHCR_IMAGE_INDEX.json "$amd_digest" "$arm_digest"
          node scripts/verify-release-manifest.mjs dist/DOCKERHUB_IMAGE_INDEX.json "$amd_digest" "$arm_digest"
          ghcr_digest=$(docker buildx imagetools inspect "$ghcr" --format '{{.Manifest.Digest}}')
          dockerhub_digest=$(docker buildx imagetools inspect "$dockerhub" --format '{{.Manifest.Digest}}')
          [[ "$ghcr_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$ghcr_digest" = "$dockerhub_digest"
          printf 'ghcr-digest=%s\n' "$ghcr_digest" >> "$GITHUB_OUTPUT"
          printf 'dockerhub-digest=%s\n' "$dockerhub_digest" >> "$GITHUB_OUTPUT"
          printf '%s  %s\n%s  %s\n' "$ghcr_digest" "$ghcr" "$dockerhub_digest" "$dockerhub" | tee dist/IMAGE_DIGESTS
          # Production pulls Docker Hub without credentials. Fail before the
          # GitHub Release is published unless both registries are public.
          anonymous_config="$RUNNER_TEMP/reader-anonymous-docker-config"
          mkdir -p "$anonymous_config"
          test "$(DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect "$dockerhub" --format '{{.Manifest.Digest}}')" = "$dockerhub_digest"
          test "$(DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect "$ghcr" --format '{{.Manifest.Digest}}')" = "$ghcr_digest"
      - name: Upload verifiable release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-pro-v${{ needs.verify-resume-inputs.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  deploy-production:
    name: Deploy immutable image to production
    needs: [verify-resume-inputs, build-and-publish-images, publish-github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.verify-resume-inputs.outputs.tag }}
      RELEASE_REVISION: ${{ needs.verify-resume-inputs.outputs.revision }}
    environment:
      name: production
      url: https://read.medwarp.cn
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-resume-inputs.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          name: reader-pro-v${{ needs.verify-resume-inputs.outputs.version }}
          path: dist
      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${PROD_SSH_KEY:?Missing production SSH key}"
          : "${PROD_SSH_KNOWN_HOSTS:?Missing pinned production known_hosts entry}"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload deployment manifest and activate with rollback snapshot
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          RELEASE_TAG: ${{ needs.verify-resume-inputs.outputs.tag }}
          READER_IMAGE: ${{ needs.verify-resume-inputs.outputs.dockerhub-image }}@${{ needs.build-and-publish-images.outputs.dockerhub-digest }}
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          : "${PROD_SSH_HOST:?Missing production SSH host}"
          : "${PROD_SSH_USER:?Missing production SSH user}"
          test "$PROD_SSH_HOST" = cdn.medwarp.cn
          release_dir="/opt/reader-pro-restored/releases/${RELEASE_TAG}"
          ssh_opts=(-o KexAlgorithms=diffie-hellman-group14-sha256 -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "${PROD_SSH_USER}@${PROD_SSH_HOST}" "install -d -m 0755 '$release_dir'"
          scp "${ssh_opts[@]}" deploy/reader-pro/compose.production.yaml "$PROD_SSH_USER@$PROD_SSH_HOST:$release_dir/compose.production.yaml"
          scp "${ssh_opts[@]}" dist/SHA256SUMS "$PROD_SSH_USER@$PROD_SSH_HOST:$release_dir/SHA256SUMS"
          ssh "${ssh_opts[@]}" "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            "RELEASE_TAG='$RELEASE_TAG' READER_IMAGE='$READER_IMAGE' RELEASE_RUN_URL='$RELEASE_RUN_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          app_dir=/opt/reader-pro-restored
          release_dir="$app_dir/releases/$RELEASE_TAG"
          rollback_dir="$release_dir/rollback"
          # Recovery must never replace an earlier snapshot for the same tag.
          test ! -e "$rollback_dir/state-before-${RELEASE_TAG}.tar"
          test -f "$app_dir/.env"
          test -d "$app_dir/storage"
          # Authenticate/pull before stopping the old container. This makes a
          # private Docker Hub repository or a rate-limit failure non-disruptive.
          docker pull "$READER_IMAGE"
          docker image inspect --format '{{join .RepoDigests "\n"}}' "$READER_IMAGE" | grep -Fx "$READER_IMAGE"
          install -d -m 0750 "$rollback_dir"
          storage_bytes=$(du -sb "$app_dir/storage" | awk '{print $1}')
          available_bytes=$(df -PB1 "$app_dir" | awk 'NR==2 {print $4}')
          # Keep room for: the verified pre-deploy snapshot, failed-state rescue,
          # restored storage, and filesystem/tar metadata. A fixed 2 GiB margin
          # avoids a near-empty small installation passing on rounding alone.
          required_bytes="$((storage_bytes * 3 + 2147483648))"
          if [ "$available_bytes" -lt "$required_bytes" ]; then
            echo "Insufficient rollback space: need ${required_bytes} bytes, have ${available_bytes}." >&2
            exit 1
          fi
          initial_deploy=false
          previous_image=''
          if docker inspect reader-pro-restored >/dev/null 2>&1; then
            previous_image=$(docker inspect --format '{{.Image}}' reader-pro-restored)
            test -n "$previous_image"
          else
            # A first deployment has no service/image to restart. It still
            # snapshots imported storage before activating the new container.
            initial_deploy=true
          fi
          rollback_image="reader-pro-restored:rollback-${RELEASE_TAG}"
          if [ "$initial_deploy" = false ]; then
            docker image tag "$previous_image" "$rollback_image"
            printf '%s\n' "$previous_image" > "$rollback_dir/previous-image-id"
            printf '%s\n' "$rollback_image" > "$rollback_dir/rollback-image-ref"
          fi
          printf '%s\n' "$READER_IMAGE" > "$rollback_dir/expected-image-ref"
          snapshot_ready=false
          restore_previous_service() {
            docker start reader-pro-restored
            test "$(docker inspect -f '{{.State.Running}}' reader-pro-restored)" = true
            test "$(docker inspect --format '{{.Image}}' reader-pro-restored)" = "$previous_image"
          }
          rollback() {
            trap - ERR
            if [ "$snapshot_ready" != true ]; then
              # No snapshot has been made and storage has not been moved: the
              # original container and data are still the only safe rollback.
              if [ "$initial_deploy" = false ]; then
                if [ "$(docker inspect -f '{{.State.Running}}' reader-pro-restored)" != true ]; then
                  restore_previous_service
                fi
                test "$(docker inspect -f '{{.State.Running}}' reader-pro-restored)" = true
                test "$(docker inspect --format '{{.Image}}' reader-pro-restored)" = "$previous_image"
              else
                echo 'Initial deployment failed before snapshot; no previous Reader container was stopped.' >&2
              fi
              return
            fi
            docker stop reader-pro-restored || true
            # Refuse to overlay a restored tree unless the failed state has
            # first been archived and its archive has been verified.
            rescue_ok=true
            if ! tar --xattrs --acls -C "$app_dir" -cpf "$rollback_dir/rescue-after-failure-${RELEASE_TAG}.tar" .env storage compose.yaml \
              || ! tar -tf "$rollback_dir/rescue-after-failure-${RELEASE_TAG}.tar" >/dev/null \
              || ! sha256sum "$rollback_dir/rescue-after-failure-${RELEASE_TAG}.tar" > "$rollback_dir/rescue-after-failure-${RELEASE_TAG}.sha256"; then
              rescue_ok=false
              echo 'Failed to archive the fault state; restoring the already verified pre-deploy snapshot.' >&2
            fi
            if ! mv "$app_dir/storage" "$rollback_dir/storage-after-failure-${RELEASE_TAG}"; then
              echo 'Could not move failed storage aside; attempting previous image without overwriting data.' >&2
              if [ "$initial_deploy" = false ]; then
                READER_IMAGE="$rollback_image" docker compose -f "$app_dir/compose.yaml" up -d --no-build --force-recreate reader-pro
                test "$(docker inspect -f '{{.State.Running}}' reader-pro-restored)" = true
                test "$(docker inspect --format '{{.Image}}' reader-pro-restored)" = "$previous_image"
              fi
              return 1
            fi
            tar -C "$app_dir" -xpf "$rollback_dir/state-before-${RELEASE_TAG}.tar"
            if [ "$initial_deploy" = false ]; then
              READER_IMAGE="$rollback_image" docker compose -f "$app_dir/compose.yaml" up -d --no-build --force-recreate reader-pro
              test "$(docker inspect -f '{{.State.Running}}' reader-pro-restored)" = true
              test "$(docker inspect --format '{{.Image}}' reader-pro-restored)" = "$previous_image"
            fi
            if [ "$rescue_ok" = false ]; then return 1; fi
          }
          trap rollback ERR
          if [ "$initial_deploy" = false ]; then docker stop reader-pro-restored; fi
          # The service is stopped before archiving storage, so this is a
          # consistent application-level snapshot rather than an online tar.
          tar --xattrs --acls -C "$app_dir" -cpf "$rollback_dir/state-before-${RELEASE_TAG}.tar" .env storage compose.yaml
          tar -tf "$rollback_dir/state-before-${RELEASE_TAG}.tar" >/dev/null
          sha256sum "$rollback_dir/state-before-${RELEASE_TAG}.tar" > "$rollback_dir/state-before-${RELEASE_TAG}.sha256"
          snapshot_ready=true
          install -m 0644 "$release_dir/compose.production.yaml" "$app_dir/compose.yaml"
          READER_IMAGE="$READER_IMAGE" docker compose -f "$app_dir/compose.yaml" config --quiet
          READER_IMAGE="$READER_IMAGE" docker compose -f "$app_dir/compose.yaml" up -d --no-build --force-recreate reader-pro
          test "$(docker inspect --format '{{.Config.Image}}' reader-pro-restored)" = "$READER_IMAGE"
          for attempt in $(seq 1 30); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' reader-pro-restored)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && exit 1
            sleep 4
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' reader-pro-restored)" = healthy ]
          curl -fsS http://127.0.0.1:18088/reader3/getSystemInfo | python3 -c 'import json,sys; assert json.load(sys.stdin)["isSuccess"] is True'
          printf 'tag=%s\nimage=%s\nrun=%s\ndeployed_at=%s\n' "$RELEASE_TAG" "$READER_IMAGE" "$RELEASE_RUN_URL" "$(date --iso-8601=seconds)" > "$app_dir/DEPLOYED_RELEASE"
          trap - ERR
          REMOTE
      - name: Verify public application domain
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          RELEASE_TAG: ${{ needs.verify-resume-inputs.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify-resume-inputs.outputs.version }}
          RELEASE_REVISION: ${{ needs.verify-resume-inputs.outputs.revision }}
          READER_IMAGE: ${{ needs.verify-resume-inputs.outputs.dockerhub-image }}@${{ needs.build-and-publish-images.outputs.dockerhub-digest }}
        run: |
          set -euo pipefail
          public_ok=false
          if curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 https://read.medwarp.cn/ > /dev/null \
            && curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 https://read.medwarp.cn/reader3/getSystemInfo | jq -e '.isSuccess == true' >/dev/null \
            && curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 https://read.medwarp.cn/assets/reader-release.json \
              | jq -e --arg version "$RELEASE_VERSION" --arg revision "$RELEASE_REVISION" '.version == $version and .buildRevision == $revision' >/dev/null; then
            public_ok=true
          fi
          if [ "$public_ok" = true ]; then exit 0; fi

          # The public path failed after local activation. Roll back remotely only
          # after proving the container is the just-deployed immutable reference.
          # This command preserves a rescue archive before restoring the verified
          # pre-deploy snapshot and previous image.
          test "$PROD_SSH_HOST" = cdn.medwarp.cn
          ssh_opts=(-o KexAlgorithms=diffie-hellman-group14-sha256 -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            "RELEASE_TAG='$RELEASE_TAG' READER_IMAGE='$READER_IMAGE' bash -s" <<'REMOTE_ROLLBACK'
          set -euo pipefail
          app_dir=/opt/reader-pro-restored
          rollback_dir="$app_dir/releases/$RELEASE_TAG/rollback"
          test -f "$rollback_dir/expected-image-ref"
          test "$(cat "$rollback_dir/expected-image-ref")" = "$READER_IMAGE"
          test "$(docker inspect --format '{{.Config.Image}}' reader-pro-restored)" = "$READER_IMAGE"
          sha256sum -c "$rollback_dir/state-before-${RELEASE_TAG}.sha256"
          failed_storage="$rollback_dir/storage-after-public-failure-${RELEASE_TAG}"
          partial_restore="$rollback_dir/partial-public-restoration-${RELEASE_TAG}-$(date +%s)"
          storage_moved=false
          rollback_failed() {
            original_status=$?
            trap - ERR
            # If any rollback step fails, restore the last running release and
            # its latest storage. Preserve every intermediate tree for recovery.
            if [ "$storage_moved" = true ]; then
              if [ -e "$app_dir/storage" ]; then mv "$app_dir/storage" "$partial_restore" || true; fi
              mv "$failed_storage" "$app_dir/storage" || true
            fi
            if [ -d "$app_dir/storage" ]; then
              READER_IMAGE="$READER_IMAGE" docker compose -f "$app_dir/compose.yaml" up -d --no-build --force-recreate reader-pro \
                || docker start reader-pro-restored || true
            fi
            echo 'Rollback failed; attempted to restore the just-deployed service and preserved all recovery material.' >&2
            exit "$original_status"
          }
          trap rollback_failed ERR
          docker stop reader-pro-restored
          tar --xattrs --acls -C "$app_dir" -cpf "$rollback_dir/rescue-after-public-failure-${RELEASE_TAG}.tar" .env storage compose.yaml
          tar -tf "$rollback_dir/rescue-after-public-failure-${RELEASE_TAG}.tar" >/dev/null
          sha256sum "$rollback_dir/rescue-after-public-failure-${RELEASE_TAG}.tar" > "$rollback_dir/rescue-after-public-failure-${RELEASE_TAG}.sha256"
          mv "$app_dir/storage" "$failed_storage"
          storage_moved=true
          tar -C "$app_dir" -xpf "$rollback_dir/state-before-${RELEASE_TAG}.tar"
          if [ -f "$rollback_dir/rollback-image-ref" ]; then
            rollback_image=$(cat "$rollback_dir/rollback-image-ref")
            previous_image=$(cat "$rollback_dir/previous-image-id")
            READER_IMAGE="$rollback_image" docker compose -f "$app_dir/compose.yaml" up -d --no-build --force-recreate reader-pro
            test "$(docker inspect --format '{{.Image}}' reader-pro-restored)" = "$previous_image"
            curl -fsS http://127.0.0.1:18088/reader3/getSystemInfo | python3 -c 'import json,sys; assert json.load(sys.stdin)["isSuccess"] is True'
          else
            docker rm reader-pro-restored
          fi
          trap - ERR
          REMOTE_ROLLBACK
          echo 'Public release verification failed; production was rolled back to its verified pre-deploy image and data.' >&2
          exit 1

  publish-github-release:
    name: Publish GitHub Release
    needs: [verify-resume-inputs, build-and-publish-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.verify-resume-inputs.outputs.tag }}
      RELEASE_REVISION: ${{ needs.verify-resume-inputs.outputs.revision }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-resume-inputs.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          name: reader-pro-v${{ needs.verify-resume-inputs.outputs.version }}
          path: dist
      - name: Create verified formal release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          notes="docs/releases/${tag}.md"
          test -f "$notes"
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Reader Pro ${tag}" --notes-file "$notes"
