name: Pull Request Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - master

concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

# 安全：公开仓库 + self-hosted runner —— fork PR 的代码可能含恶意内容，
# 只在同仓库分支的 PR 上用 self-hosted；fork PR 落到隔离的托管 runner。
# 另请在仓库 Settings → Actions 中设置 fork PR workflow 需批准或禁用。
permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  changes:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'self-hosted' || 'ubuntu-latest' }}
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/main/**'
              - 'src/test/**'
              - '*.gradle'
              - '*.gradle.kts'
              - 'gradle/**'
              - 'settings.gradle'
              - 'cli.gradle'
              - 'build.gradle.kts'
            web:
              - 'web/**'
              - 'simple-web-src/**'

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'
      - name: Compile Kotlin
        run: .\gradlew.bat compileKotlin compileJava -x test

  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Cache node_modules
        uses: actions/cache@v3
        id: web-node-modules
        with:
          path: web/node_modules
          key: ${{ runner.os }}-web-node-modules-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-web-node-modules-
      - name: Install dependencies
        if: steps.web-node-modules.outputs.cache-hit != 'true'
        run: cd web; npm ci
      - name: Build web
        run: cd web; npm run build
