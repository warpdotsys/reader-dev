name: Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  # 同 tag 重复触发（tag push + workflow_dispatch）时取消旧 run，只保留最新
  cancel-in-progress: true

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: DE
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          # 发版保护需要完整历史做 merge-base 判定（shallow clone 会误判为「非祖先」而禁止 legacy 发版）
          fetch-depth: 0
      - name: 发版保护
        shell: bash
        run: |
          git fetch origin legacy
          if git merge-base --is-ancestor $GITHUB_SHA origin/legacy; then
            echo 'OK 允许发版'
          else
            echo 'Rust 开发分支禁止发版（防止用户误更新）'
            exit 1
          fi
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build jar
        run: ./gradlew -b cli.gradle assemble -x test
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/*.jar
          generate_release_notes: true

  build-and-push:
    runs-on: DE
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          # 发版保护需要完整历史做 merge-base 判定（shallow clone 会误判为「非祖先」而禁止 legacy 发版）
          fetch-depth: 0
      - name: 发版保护
        shell: bash
        run: |
          git fetch origin legacy
          if git merge-base --is-ancestor $GITHUB_SHA origin/legacy; then
            echo 'OK 允许发版'
          else
            echo 'Rust 开发分支禁止发版（防止用户误更新）'
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/warpdotsys/reader
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=legacy,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.source
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # self-hosted：本地磁盘缓存（无网络传输，跨 run 持久，快于 gha 远程缓存）
          cache-from: type=local,src=/tmp/buildx-cache
          cache-to: type=local,dest=/tmp/buildx-cache,mode=max
