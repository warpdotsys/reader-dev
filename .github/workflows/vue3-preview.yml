name: Vue 3 preview build

on:
  push:
    branches: [legacy]
    paths:
      - '.github/workflows/vue3-preview.yml'
      - 'build.gradle.kts'
      - 'web/package.json'
      - 'deploy/reader-pro/Dockerfile'
      - 'browser-poc/**'
      - 'src/main/java/com/htmake/reader/config/AppConfig.kt'
      - 'src/main/java/com/htmake/reader/api/YueduApi.kt'
      - 'src/main/java/com/htmake/reader/api/controller/BookSourceController.kt'
      - 'src/main/java/com/htmake/reader/api/controller/FileController.kt'
      - 'web-vue3/**'
  pull_request:
    branches: [legacy]
    paths:
      - '.github/workflows/vue3-preview.yml'
      - 'build.gradle.kts'
      - 'web/package.json'
      - 'deploy/reader-pro/Dockerfile'
      - 'browser-poc/**'
      - 'src/main/java/com/htmake/reader/config/AppConfig.kt'
      - 'src/main/java/com/htmake/reader/api/YueduApi.kt'
      - 'src/main/java/com/htmake/reader/api/controller/BookSourceController.kt'
      - 'src/main/java/com/htmake/reader/api/controller/FileController.kt'
      - 'web-vue3/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-vue3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-vue3/package-lock.json
      - name: Install locked dependencies and compile preview
        run: |
          npm ci
          npm run build
          npm test
          npm run audit:api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vue3-preview-${{ github.sha }}
          path: web-vue3/dist/
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Isolated Vue 3 browser journeys in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-vue3/package-lock.json
      - name: Build Reader and install preview dependencies
        run: |
          npm ci --prefix web-vue3
          npm run build --prefix web-vue3
          chmod +x gradlew
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 ./gradlew -PreaderWebUi=vue3 test bootJar --no-daemon
          jar=$(find build/libs -maxdepth 1 -type f -name 'reader-*.jar' -print -quit)
          test -n "$jar"
          echo "READER_JAR=$jar" >> "$GITHUB_ENV"
      - name: Assert Vue 3 assets are packaged in the Reader JAR
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 "$READER_JAR" | grep -q 'BOOT-INF/classes/web-vue3/index.html'
          unzip -Z1 "$READER_JAR" | grep -q 'BOOT-INF/classes/web-vue3/static/index-.*\.js'
      - name: Resolve Chromium on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$chrome" ]]; then
            npx --yes playwright@1.63.0 install chromium
            chrome="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*/chrome-linux*/chrome' -print -quit)"
          fi
          test -n "$chrome" && test -x "$chrome"
          echo "READER_BROWSER_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
      - name: Run isolated backend, book source, and Vite preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vue3-reader-data"
          python3 scripts/mock-book-source.py --port 18894 > "$RUNNER_TEMP/vue3-source.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vue3-source.pid"
          java -jar "$READER_JAR" \
            "--reader.app.workDir=$RUNNER_TEMP/vue3-reader-data" \
            --reader.server.port=18895 --reader.app.secure=true \
            --reader.app.web-ui=vue3 \
            --reader.app.defaultUserEnableWebdav=true \
            --reader.app.licenseCheckEnabled=false \
            > "$RUNNER_TEMP/vue3-reader.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vue3-reader.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18894/health > /dev/null && \
               curl -fsS http://127.0.0.1:18895/reader3/getSystemInfo > /dev/null && \
               curl -fsS -H 'Accept: text/html' http://127.0.0.1:18895/login > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18894/health > /dev/null
          curl -fsS http://127.0.0.1:18895/reader3/getSystemInfo > /dev/null
          curl -fsS -H 'Accept: text/html' http://127.0.0.1:18895/login > /dev/null
          curl -fsS http://127.0.0.1:18895/ > "$RUNNER_TEMP/vue3-root.html"
          curl -fsS -H 'Accept: text/html' http://127.0.0.1:18895/login > "$RUNNER_TEMP/vue3-login.html"
          cmp "$RUNNER_TEMP/vue3-root.html" "$RUNNER_TEMP/vue3-login.html"
          grep -q '/static/index-.*\.js' "$RUNNER_TEMP/vue3-root.html"
      - name: Exercise Vue 3 pages with isolated accounts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          READER_VUE3_ISOLATED: '1'
          READER_VUE3_PREVIEW_URL: http://127.0.0.1:18895
          READER_BOOK_FIXTURE_URL: http://127.0.0.1:18894
        run: |
          ./gradlew -p browser-poc test \
            --tests 'com.medwarp.reader.browserpoc.Vue3PreviewLoginTest' \
            --tests 'com.medwarp.reader.browserpoc.Vue3PreviewReadingTest' \
            --tests 'com.medwarp.reader.browserpoc.Vue3PreviewSearchTest' \
            --tests 'com.medwarp.reader.browserpoc.Vue3PreviewSourceTest' \
            --tests 'com.medwarp.reader.browserpoc.Vue3PreviewGroupTest' \
            --tests 'com.medwarp.reader.browserpoc.Vue3PreviewReplaceRuleTest' \
            --tests 'com.medwarp.reader.browserpoc.Vue3PreviewFileTest' \
            --tests 'com.medwarp.reader.browserpoc.Vue3PreviewBackupTest' --no-daemon
          for name in Login Reading Search Source Group ReplaceRule File Backup; do
            report="browser-poc/build/test-results/test/TEST-com.medwarp.reader.browserpoc.Vue3Preview${name}Test.xml"
            grep -q 'tests="1" skipped="0" failures="0" errors="0"' "$report"
          done
      - name: Preserve Vue 3 source journey diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vue3-source-browser-diagnostics-${{ github.sha }}
          path: |
            browser-poc/build/test-results/test/TEST-com.medwarp.reader.browserpoc.Vue3PreviewSourceTest.xml
            ${{ runner.temp }}/vue3-source-login-timeout.png
            ${{ runner.temp }}/vue3-source-edit-timeout.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Start a separate Reader with manager-key protection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vue3-secure-data"
          java -jar "$READER_JAR" \
            "--reader.app.workDir=$RUNNER_TEMP/vue3-secure-data" \
            --reader.server.port=18896 --reader.app.secure=true \
            --reader.app.web-ui=vue3 \
            --reader.app.secureKey=Vue3ProbeManagerKey-2026 \
            --reader.app.defaultUserEnableLocalStore=true \
            --reader.app.licenseCheckEnabled=false \
            > "$RUNNER_TEMP/vue3-secure.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vue3-secure.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18896/reader3/getSystemInfo > /dev/null && \
               curl -fsS -H 'Accept: text/html' http://127.0.0.1:18896/login > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18896/reader3/getSystemInfo > /dev/null
          curl -fsS -H 'Accept: text/html' http://127.0.0.1:18896/login > /dev/null
      - name: Verify secure file write and retry in Chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          READER_VUE3_ISOLATED: '1'
          READER_VUE3_SECURE_URL: http://127.0.0.1:18896
          READER_TEST_MANAGER_KEY: Vue3ProbeManagerKey-2026
        run: |
          ./gradlew -p browser-poc test \
            --tests 'com.medwarp.reader.browserpoc.Vue3PreviewSecureFileTest' --no-daemon
          grep -q 'tests="1" skipped="0" failures="0" errors="0"' \
            browser-poc/build/test-results/test/TEST-com.medwarp.reader.browserpoc.Vue3PreviewSecureFileTest.xml
      - name: Build and serve the Vue 3 artifact at /reader/
        shell: bash
        run: |
          set -euo pipefail
          READER_UI_BASE=/reader/ npm --prefix web-vue3 run build
          READER_UI_BASE=/reader/ READER_BACKEND_URL=http://127.0.0.1:18895 \
            npm --prefix web-vue3 run preview -- --host 127.0.0.1 --port 4173 \
            > "$RUNNER_TEMP/vue3-subdir.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vue3-subdir.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/reader/login > /dev/null && \
               curl -fsS http://127.0.0.1:4173/reader3/getSystemInfo > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173/reader/login > /dev/null
          curl -fsS http://127.0.0.1:4173/reader3/getSystemInfo > /dev/null
      - name: Verify the built subdirectory UI in Chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          READER_VUE3_ISOLATED: '1'
          READER_VUE3_SUBDIR_URL: http://127.0.0.1:4173/reader
        run: |
          ./gradlew -p browser-poc test \
            --tests 'com.medwarp.reader.browserpoc.Vue3PreviewSubdirectoryTest' --no-daemon
          grep -q 'tests="1" skipped="0" failures="0" errors="0"' \
            browser-poc/build/test-results/test/TEST-com.medwarp.reader.browserpoc.Vue3PreviewSubdirectoryTest.xml
      - name: Preserve diagnostics and stop isolated services
        if: always()
        shell: bash
        run: |
          for service in vite reader source secure secure-vite subdir; do
            if [[ -f "$RUNNER_TEMP/vue3-$service.pid" ]]; then
              kill "$(cat "$RUNNER_TEMP/vue3-$service.pid")" 2>/dev/null || true
            fi
          done
          for service in vite reader source secure secure-vite subdir; do
            if [[ -f "$RUNNER_TEMP/vue3-$service.log" ]]; then
              echo "=== $service (last 80 lines) ==="
              tail -n 80 "$RUNNER_TEMP/vue3-$service.log"
            fi
          done
