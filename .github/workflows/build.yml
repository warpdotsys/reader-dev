name: CI Build

on:
  push:
    branches: [master, rust, legacy]
  pull_request:
    branches: [master, rust, legacy]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Check
        run: cargo check
