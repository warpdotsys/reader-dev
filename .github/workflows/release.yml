name: Release and deploy Reader Pro

on:
  push:
    tags:
      - 'v*-restored.*'

permissions:
  contents: read

concurrency:
  group: reader-pro-production
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag belongs to legacy
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin legacy
          git merge-base --is-ancestor "$GITHUB_SHA" origin/legacy
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - name: Set up Temurin JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Run tests and build JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean test bootJar --no-daemon --stacktrace
          install -d dist
          install -m 0644 build/libs/reader-4.0.7.jar "dist/reader-pro-${GITHUB_REF_NAME}.jar"
          (cd dist && sha256sum "reader-pro-${GITHUB_REF_NAME}.jar" > SHA256SUMS)
      - name: Upload immutable release artifact
        uses: actions/upload-artifact@v7
        with:
          name: reader-pro-release
          path: dist/
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://read.medwarp.cn
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v7
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: reader-pro-release
          path: dist
      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload immutable artifact and deployment files
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          release_dir="/opt/reader-pro-restored/releases/${GITHUB_REF_NAME}"
          ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "install -d -m 0755 '$release_dir'"
          scp "dist/reader-pro-${GITHUB_REF_NAME}.jar" \
              dist/SHA256SUMS \
              deploy/reader-pro/Dockerfile \
              deploy/reader-pro/compose.production.yaml \
              deploy/reader-pro/read.medwarp.cn.conf \
              "${PROD_SSH_USER}@${PROD_SSH_HOST}:${release_dir}/"
      - name: Activate release with rollback
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            "RELEASE_TAG='$RELEASE_TAG' RELEASE_RUN_URL='$RELEASE_RUN_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          app_dir=/opt/reader-pro-restored
          release_dir="$app_dir/releases/$RELEASE_TAG"
          rollback_dir="$app_dir/releases/rollback-${RELEASE_TAG}"
          artifact="$release_dir/reader-pro-${RELEASE_TAG}.jar"
          cd "$release_dir"
          sha256sum -c SHA256SUMS
          install -d -m 0755 "$rollback_dir"
          cp -a "$app_dir/reader-4.0.7.jar" "$rollback_dir/reader-4.0.7.jar"
          cp -a /etc/nginx/conf.d/read.medwarp.cn.conf "$rollback_dir/read.medwarp.cn.conf"
          docker tag medwarp/reader-pro-restored:4.0.7 "medwarp/reader-pro-restored:rollback-${RELEASE_TAG}"
          rollback() {
            echo 'Deployment failed; restoring previous JAR, image and Nginx configuration.' >&2
            install -m 0644 "$rollback_dir/reader-4.0.7.jar" "$app_dir/reader-4.0.7.jar"
            install -m 0644 "$rollback_dir/read.medwarp.cn.conf" /etc/nginx/conf.d/read.medwarp.cn.conf
            docker tag "medwarp/reader-pro-restored:rollback-${RELEASE_TAG}" medwarp/reader-pro-restored:4.0.7
            cd "$app_dir"
            docker compose up -d --no-deps --force-recreate reader-pro || true
            /www/server/nginx/sbin/nginx -t -c /www/server/nginx/conf/nginx.conf \
              && /www/server/nginx/sbin/nginx -s reload -c /www/server/nginx/conf/nginx.conf || true
          }
          trap rollback ERR
          install -m 0644 "$artifact" "$app_dir/reader-4.0.7.jar"
          install -m 0644 "$release_dir/Dockerfile" "$app_dir/Dockerfile"
          install -m 0644 "$release_dir/compose.production.yaml" "$app_dir/compose.yaml"
          install -m 0644 "$release_dir/read.medwarp.cn.conf" /etc/nginx/conf.d/read.medwarp.cn.conf
          install -d -m 0750 -o 10001 -g 10001 "$app_dir/logs"
          find "$app_dir/logs" -maxdepth 1 -type f -name 'reader-*.log' -exec chmod 0640 {} +
          /www/server/nginx/sbin/nginx -t -c /www/server/nginx/conf/nginx.conf
          cd "$app_dir"
          docker compose build reader-pro
          docker compose up -d --no-deps reader-pro
          for attempt in $(seq 1 24); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' reader-pro-restored)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && exit 1
            sleep 5
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' reader-pro-restored)" = healthy ]
          /www/server/nginx/sbin/nginx -s reload -c /www/server/nginx/conf/nginx.conf
          curl -fsS -o /tmp/reader-home.html --resolve read.medwarp.cn:443:127.0.0.1 https://read.medwarp.cn/
          curl -fsS --resolve read.medwarp.cn:443:127.0.0.1 \
            https://read.medwarp.cn/reader3/getSystemInfo \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["isSuccess"] is True'
          curl -fsS -o /tmp/reader-app.js --resolve read.medwarp.cn:443:127.0.0.1 \
            'https://read.medwarp.cn/js/app.54619a3e.js?release-check=1'
          python3 -c 'open("/tmp/reader-app.js", encoding="utf-8", errors="strict").read()'
          artifact_sha=$(sha256sum "$artifact" | cut -d ' ' -f1)
          printf 'tag=%s\nsha256=%s\nrun=%s\ndeployed_at=%s\n' \
            "$RELEASE_TAG" "$artifact_sha" "$RELEASE_RUN_URL" "$(date --iso-8601=seconds)" \
            > "$app_dir/DEPLOYED_RELEASE"
          trap - ERR
          REMOTE
      - name: Verify public endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 https://read.medwarp.cn/ > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 https://read.medwarp.cn/reader3/getSystemInfo \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["isSuccess"] is True'

  publish:
    name: Publish GitHub Release
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
      - name: Download released artifact
        uses: actions/download-artifact@v8
        with:
          name: reader-pro-release
          path: dist
      - name: Create immutable prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Reader Pro ${GITHUB_REF_NAME}" \
            --notes-file "$notes"
