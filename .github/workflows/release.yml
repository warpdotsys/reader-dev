name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: |
          npm ci || npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build-binaries:
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x64
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: tar.gz
          - target: i686-unknown-linux-gnu
            name: linux-x86
            ext: tar.gz
          - target: x86_64-pc-windows-gnu
            name: windows-x64
            ext: zip
          - target: aarch64-pc-windows-gnullvm
            name: windows-arm64
            ext: zip
          - target: i686-pc-windows-gnu
            name: windows-x86
            ext: zip
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        run: |
          pip install cargo-zigbuild || cargo install cargo-zigbuild
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: src/main/resources/web
      - name: Build release (${{ matrix.target }})
        run: cargo zigbuild --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_DIR: target
      - name: Package
        shell: bash
        run: |
          VERSION=$(grep -E '^version = ' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p package/reader-$VERSION
          BIN=target/${{ matrix.target }}/release/reader
          if [ "${{ matrix.ext }}" = "zip" ]; then BIN="$BIN.exe"; fi
          cp "$BIN" package/reader-$VERSION/
          cp README.md package/reader-$VERSION/
          # 自包含 web 前端（二进制运行时按 workdir 相对路径加载）
          cp -r src/main/resources/web package/reader-$VERSION/web
          cd package
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd reader-$VERSION && zip -r ../reader-$VERSION-${{ matrix.name }}.zip .)
          else
            tar -czf reader-$VERSION-${{ matrix.name }}.tar.gz reader-$VERSION
          fi
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: |
            package/reader-*.tar.gz
            package/reader-*.zip
          if-no-files-found: warn

  docker:
    needs: [build-web, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Download linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-linux-*
          path: artifacts
          merge-multiple: true
      - name: Stage per-arch binaries
        shell: bash
        run: |
          set -e
          # artifact 合并后文件：reader-<ver>-linux-<name>.tar.gz
          stage() { local glob=$1 arch=$2; mkdir -p bin/linux-$arch; tar -xzf $glob -C "bin/linux-$arch" --strip-components=1; chmod +x bin/linux-$arch/reader; }
          stage artifacts/reader-*-linux-x64.tar.gz amd64
          stage artifacts/reader-*-linux-arm64.tar.gz arm64
          stage artifacts/reader-*-linux-x86.tar.gz 386
          ls -la bin/linux-amd64 bin/linux-arm64 bin/linux-386
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
        continue-on-error: true
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR + Docker Hub（DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD，与 archive 分支命名一致）
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/reader-dev
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, 'beta') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/386
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [build-binaries, docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
