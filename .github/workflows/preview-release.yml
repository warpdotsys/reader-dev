name: Prepare Reader preview

on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft prerelease after every gate passes; never deploy or mark latest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate candidate identity and release ordering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/prepare-preview.mjs --check
          version=$(node -p "require('./preview.json').version")
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/published-tags"
          latest=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/published-tags" | sed 's/^v//' | sort -V | tail -n 1)
          test -n "$latest"
          dpkg --compare-versions "$version" gt "$latest"
          node --test scripts/prepare-preview.test.mjs

  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  ui:
    needs: checks
    uses: ./.github/workflows/vue3-preview.yml

  native:
    needs: checks
    uses: ./.github/workflows/release-native.yml

  prepare:
    needs: [checks, ui, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: reader-release-jar-${{ github.sha }}
          path: candidate-inputs/jar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: reader-ci-jar-${{ github.sha }}
          path: candidate-inputs/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: reader-jar-reproducibility-${{ github.sha }}
          path: candidate-inputs/repro
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: license-jar-gate-${{ github.sha }}
          path: candidate-inputs/license
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          pattern: reader-tested-native-*-${{ github.sha }}
          path: candidate-inputs/native
      - name: Verify exact tested bytes and assemble without rebuilding
        run: |
          node scripts/prepare-preview.mjs candidate-inputs dist-preview "$GITHUB_SHA" \
            "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          (cd dist-preview && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-preview-${{ github.sha }}
          path: dist-preview/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Candidate summary
        run: |
          printf '## Preview prepared, not deployed\n\nSource: `%s`\n\nArtifact: `reader-preview-%s` (7 days). Read RELEASE-NOTES.md before use.\n' "$GITHUB_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  draft:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_draft }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: reader-preview-${{ github.sha }}
          path: dist-preview
      - name: Create a new draft only; never overwrite a tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(jq -r .tag dist-preview/PREVIEW.json)
          test "$(jq -r .revision dist-preview/PREVIEW.json)" = "$GITHUB_SHA"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[1-9][0-9]*$ ]]
          (cd dist-preview && sha256sum -c SHA256SUMS)
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/existing-releases"
          if grep -Fx "$tag" "$RUNNER_TEMP/existing-releases"; then echo 'Release already exists; inspect it instead of overwriting.' >&2; exit 1; fi
          git ls-remote --tags origin "refs/tags/$tag" > "$RUNNER_TEMP/existing-tag"
          test ! -s "$RUNNER_TEMP/existing-tag"
          gh release create "$tag" dist-preview/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease --latest=false --title "Reader Pro $tag" --notes-file dist-preview/RELEASE-NOTES.md
