name: Native release artifact rehearsal

# No registry credentials, registry writes, real books, or production access.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [legacy]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-native.yml'
      - 'scripts/check-release-pipeline*'
      - 'scripts/release-native-artifacts*'
      - 'scripts/verify-release-manifest*'
      - 'scripts/smoke-native-release.sh'
      - 'scripts/smoke-local-webview.py'
      - 'scripts/verify-reader-async-smoke.py'
      - 'scripts/verify-reader-metadata-smoke.py'
      - 'scripts/probe-public-metadata.py'
      - 'src/test/python/reader_metadata_smoke_test.py'
      - 'scripts/verify-reader-default-ui.py'
      - 'src/test/python/reader_default_ui_test.py'
      - 'src/test/python/reader_async_smoke_test.py'
      - 'scripts/import-native-release.sh'
      - 'scripts/verify-camoufox-contracts.py'
      - 'scripts/verify-source-document-observation.py'
      - 'src/test/python/source_document_observation_report_test.py'
      - 'src/main/resources/camoufox/worker.py'
      - 'src/test/java/com/htmake/reader/utils/CamoufoxWebviewRendererTest.kt'
      - 'src/test/python/camoufox_contract_report_test.py'
      - 'src/test/python/camoufox_script_javascript_test.py'
      - 'src/test/javascript/camoufox-source-script.test.mjs'
      - 'deploy/reader-pro/**'

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-jar:
    name: Build one shared Java Kotlin JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.jar.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-vue3/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Match the hashed production wheels, not the runner's Python default.
          python-version: '3.10'
      - name: Verify release contracts and build the shared JAR once
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-pipeline.mjs
          node --test scripts/check-release-pipeline.test.mjs scripts/release-native-artifacts.test.mjs scripts/verify-release-manifest.test.mjs
          python3 -m unittest discover -s src/test/python -p '*_test.py'
          npm ci --prefix web-vue3
          npm --prefix web-vue3 test
          npm --prefix web-vue3 run build
          chmod +x gradlew
          ./gradlew -PreaderWebUi=vue3 clean test bootJar --max-workers=2 --no-daemon --stacktrace
          version=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' build.gradle.kts)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(node -p "require('./web/package.json').version")" = "$version"
          test "$(node -p "require('./web-vue3/package.json').version")" = "$version"
          test -s "build/libs/reader-${version}.jar"
          install -d dist
          install -m 0644 "build/libs/reader-${version}.jar" "dist/reader-pro-v${version}.jar"
          (cd dist && sha256sum "reader-pro-v${version}.jar") > dist/SHA256SUMS
          unzip -Z1 "dist/reader-pro-v${version}.jar" > "$RUNNER_TEMP/reader-jar-entries.txt"
          grep -Fx 'BOOT-INF/classes/camoufox/worker.py' "$RUNNER_TEMP/reader-jar-entries.txt"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Preserve full shared-JAR unit reports before the targeted browser run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-release-java-contracts-${{ github.sha }}
          path: build/test-results/test/TEST-*.xml
          if-no-files-found: error
          retention-days: 14
      - name: Install the pinned default-engine runtime for release contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/reader-release-camoufox"
          "$RUNNER_TEMP/reader-release-camoufox/bin/pip" install --no-cache-dir --require-hashes \
            --requirement deploy/reader-pro/requirements-camoufox.lock
          READER_CAMOUFOX_PYTHON="$RUNNER_TEMP/reader-release-camoufox/bin/python" \
            "$RUNNER_TEMP/reader-release-camoufox/bin/python" deploy/reader-pro/install_camoufox_pinned.py
      - name: Verify packaged default engine contracts before exporting the shared JAR
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          READER_BROWSER_ALLOW_PRIVATE_NETWORKS: 'true'
          READER_CAMOUFOX_PYTHON: ${{ runner.temp }}/reader-release-camoufox/bin/python
          READER_CAMOUFOX_BROWSER_VERSION: '152.0.4-beta.30'
        run: |
          set -euo pipefail
          ./gradlew -PreaderWebUi=vue3 test --tests 'com.htmake.reader.utils.CamoufoxWebviewRendererTest' --max-workers=2 --no-daemon
          python3 scripts/verify-camoufox-contracts.py build/test-results/test/TEST-com.htmake.reader.utils.CamoufoxWebviewRendererTest.xml
          # A source-tree test is not enough if another worker was put in the JAR.
          version='${{ steps.jar.outputs.version }}'
          cmp <(unzip -p "dist/reader-pro-v${version}.jar" BOOT-INF/classes/camoufox/worker.py) src/main/resources/camoufox/worker.py
          (cd dist && sha256sum -c SHA256SUMS)
          timeout 60s "$READER_CAMOUFOX_PYTHON" scripts/verify-source-document-observation.py \
            --browser-version "$READER_CAMOUFOX_BROWSER_VERSION" > build/source-document-observation.json
      - name: Preserve actual default-engine release contracts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-release-camoufox-contract-${{ github.sha }}
          path: build/test-results/test/TEST-com.htmake.reader.utils.CamoufoxWebviewRendererTest.xml
          if-no-files-found: error
          retention-days: 14
      - name: Preserve actual source document observations including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-release-source-document-${{ github.sha }}
          path: build/source-document-observation.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-release-jar-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  native-images:
    name: Build and test native ${{ matrix.arch }} image
    needs: build-jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Require a genuinely native hosted runner
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          kernel=$(uname -m)
          printf 'native architecture=%s runner=%s kernel=%s\n' "$EXPECTED_ARCH" "$RUNNER_ARCH" "$kernel"
          case "$EXPECTED_ARCH:$RUNNER_ARCH:$kernel" in
            amd64:X64:x86_64|arm64:ARM64:aarch64) ;;
            *) exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          name: reader-release-jar-${{ github.sha }}
          path: dist
      - name: Read and validate locked base image digests
        id: bases
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          python3 scripts/verify_camoufox_wheel_lock.py deploy/reader-pro/requirements-camoufox.lock
          temurin=$(sed -n 's/^TEMURIN_JRE_IMAGE=//p' deploy/reader-pro/base-images.lock)
          playwright=$(sed -n 's/^PLAYWRIGHT_PYTHON_IMAGE=//p' deploy/reader-pro/base-images.lock)
          [[ "$temurin" =~ ^eclipse-temurin@sha256:[0-9a-f]{64}$ ]]
          [[ "$playwright" =~ ^mcr\.microsoft\.com/playwright/python@sha256:[0-9a-f]{64}$ ]]
          install -d exported image-context
          printf 'temurin=%s\nplaywright=%s\nwheel_hashes=enforced\n' "$temurin" "$playwright" > exported/BASE_IMAGE_DIGESTS
          printf 'temurin=%s\nplaywright=%s\n' "$temurin" "$playwright" >> "$GITHUB_OUTPUT"
      - name: Build the complete native Reader image from the shared JAR
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.build-jar.outputs.version }}
        run: |
          set -euo pipefail
          install -m 0644 "dist/reader-pro-v${VERSION}.jar" "image-context/reader-${VERSION}.jar"
          cp deploy/reader-pro/Dockerfile deploy/reader-pro/requirements-camoufox.lock \
            deploy/reader-pro/camoufox-browser.lock deploy/reader-pro/install_camoufox_pinned.py \
            deploy/reader-pro/docker-entrypoint.sh image-context/
          docker build --pull --platform "linux/$ARCH" -f image-context/Dockerfile \
            --build-arg "READER_JAR=reader-${VERSION}.jar" --build-arg "READER_VERSION=$VERSION" \
            --build-arg "READER_BUILD_REVISION=${GITHUB_SHA}" --build-arg REQUIRE_WHEEL_HASHES=true \
            --build-arg 'TEMURIN_JRE_IMAGE=${{ steps.bases.outputs.temurin }}' \
            --build-arg 'PLAYWRIGHT_PYTHON_IMAGE=${{ steps.bases.outputs.playwright }}' \
            -t "reader-pro:camoufox-smoke-$ARCH" image-context
          docker image inspect --format 'Complete image size={{.Size}} bytes architecture={{.Architecture}}' "reader-pro:camoufox-smoke-$ARCH"
      - name: Run generated browser contracts under the release resource budget
        run: bash scripts/smoke-native-release.sh '${{ matrix.arch }}' '${{ needs.build-jar.outputs.version }}' "$GITHUB_SHA" built exported
      - name: Export only the smoke-tested native image and record its byte provenance
        shell: bash
        run: |
          set -euo pipefail
          arch='${{ matrix.arch }}'
          docker image inspect "reader-pro:camoufox-smoke-$arch" > exported/image-inspect.json
          docker save "reader-pro:camoufox-smoke-$arch" | gzip -1 > exported/reader-image.tar.gz
          node scripts/release-native-artifacts.mjs record "$arch" '${{ needs.build-jar.outputs.version }}' "$GITHUB_SHA" dist exported
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-tested-native-${{ matrix.arch }}-${{ github.sha }}
          path: |
            exported/reader-image.tar.gz
            exported/metadata.json
            exported/BASE_IMAGE_DIGESTS
            exported/BROWSER_SYNTHETIC.json
            exported/BROWSER_RESOURCE_BUDGET.json
            exported/DEFAULT_UI.json
            exported/RELEASE_IDENTITY.json
            exported/JAR_IDENTITY.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  verify-transferred-images:
    name: Reload and run tested ${{ matrix.arch }} image
    needs: [build-jar, native-images]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          name: reader-release-jar-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          name: reader-tested-native-${{ matrix.arch }}-${{ github.sha }}
          path: imported
      - name: Verify transferred bytes and the actually loaded image without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          arch='${{ matrix.arch }}'
          case "$arch:$RUNNER_ARCH:$(uname -m)" in
            amd64:X64:x86_64|arm64:ARM64:aarch64) ;;
            *) exit 1 ;;
          esac
          (cd dist && sha256sum -c SHA256SUMS)
          node scripts/release-native-artifacts.mjs check "$arch" '${{ needs.build-jar.outputs.version }}' "$GITHUB_SHA" dist imported
          docker load --input imported/reader-image.tar.gz
          docker image inspect "reader-pro:camoufox-smoke-$arch" > imported/image-inspect.json
          install -d transferred
          node scripts/release-native-artifacts.mjs loaded "$arch" '${{ needs.build-jar.outputs.version }}' "$GITHUB_SHA" dist imported \
            | tee transferred/IMAGE_IDENTITY.json
          cp imported/metadata.json transferred/metadata.json
      - name: Actually run the reloaded image with fresh generated accounts and storage
        run: bash scripts/smoke-native-release.sh '${{ matrix.arch }}' '${{ needs.build-jar.outputs.version }}' "$GITHUB_SHA" transferred transferred
      - name: Preserve small round-trip evidence, not the image or private content
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-native-transfer-${{ matrix.arch }}-${{ github.sha }}
          # A single directory is deliberate: upload-artifact flattens its
          # root, matching the paths consumed by the formal publisher.
          path: transferred/
          if-no-files-found: error
          retention-days: 14

  verify-publisher-imports:
    name: Exercise both publisher imports without registry credentials
    needs: [build-jar, native-images, verify-transferred-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          name: reader-release-jar-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          pattern: reader-native-transfer-*-${{ github.sha }}
          path: ${{ runner.temp }}/reader-native-transfers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          name: reader-tested-native-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/reader-native-import/amd64
      - name: Consume amd64 through the same importer used by the formal publisher
        run: bash scripts/import-native-release.sh amd64 '${{ needs.build-jar.outputs.version }}' "$GITHUB_SHA" dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          digest-mismatch: error
          name: reader-tested-native-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/reader-native-import/arm64
      - name: Consume arm64 on the same publisher runner without rebuilding it
        run: bash scripts/import-native-release.sh arm64 '${{ needs.build-jar.outputs.version }}' "$GITHUB_SHA" dist
      - name: Preserve the real publisher artifact-layout and image-import proofs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-publisher-import-${{ github.sha }}
          path: |
            dist/*-metadata.json
            dist/*_IDENTITY.json
            dist/*-BROWSER_SYNTHETIC.json
            dist/*-BROWSER_RESOURCE_BUDGET.json
            dist/*-DEFAULT_UI.json
          if-no-files-found: error
          retention-days: 14
