<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <!-- 圆角底（indigo 深渐变——呼应强调色 #4f46e5） -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 星点（夜读氛围） -->
  <circle cx="92" cy="118" r="7" fill="#fff" opacity="0.75"/>
  <circle cx="420" cy="92" r="5" fill="#fff" opacity="0.55"/>
  <circle cx="446" cy="208" r="6" fill="#fff" opacity="0.6"/>
  <circle cx="78" cy="262" r="5" fill="#fff" opacity="0.45"/>
  <circle cx="388" cy="300" r="4" fill="#fff" opacity="0.35"/>
  <circle cx="132" cy="190" r="4" fill="#fff" opacity="0.5"/>
  <!-- 月牙（右上——暖黄） -->
  <path d="M336 112 a54 54 0 1 0 46 88 a64 64 0 1 1 -46 -88 z" fill="#fde68a"/>
  <!-- 打开的书（左页浅 + 右页稍深——两页翻开） -->
  <path d="M256 296 C 208 266 158 258 116 266 L116 392 C 158 384 208 392 256 424 Z" fill="#eef2ff"/>
  <path d="M256 296 C 304 266 354 258 396 266 L396 392 C 354 384 304 392 256 424 Z" fill="#c7d2fe"/>
  <!-- 书脊 -->
  <path d="M256 296 L256 424" stroke="#4338ca" stroke-width="7" stroke-linecap="round"/>
  <!-- 书页上的阅读线（左页两行） -->
  <rect x="150" y="318" width="78" height="9" rx="4.5" fill="#a5b4fc" opacity="0.85"/>
  <rect x="150" y="342" width="62" height="9" rx="4.5" fill="#a5b4fc" opacity="0.6"/>
  <rect x="290" y="318" width="78" height="9" rx="4.5" fill="#818cf8" opacity="0.85"/>
  <rect x="290" y="342" width="62" height="9" rx="4.5" fill="#818cf8" opacity="0.6"/>
  <!-- 右侧页面上小月亮装饰（书内容） -->
  <path d="M330 360 a10 10 0 1 0 8 16 a12 12 0 1 1 -8 -16 z" fill="#818cf8" opacity="0.7"/>
</svg>
