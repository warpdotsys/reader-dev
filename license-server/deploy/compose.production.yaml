services:
  license:
    build:
      context: .
    image: medwarp/reader-license:0.1.0
    container_name: reader-license
    restart: unless-stopped
    environment:
      LICENSE_ADMIN_TOKEN: ${LICENSE_ADMIN_TOKEN:?missing LICENSE_ADMIN_TOKEN}
      LICENSE_ISSUER: https://license.medwarp.cn
      LICENSE_DATA_DIR: /var/lib/reader-license
      LICENSE_LEGACY_RSA_ENABLED: "true"
      LICENSE_CORS_ALLOWED_ORIGINS: ${LICENSE_CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ./data:/var/lib/reader-license
    ports:
      - "127.0.0.1:18087:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
