version: '3.1'
services:
  reader:
    # reader-dev rust 分支（6.x）镜像
    image: warpdotsys/reader:latest
    container_name: reader
    restart: always
    ports:
      - 4396:8080
    volumes:
      - /home/reader/storage:/data/storage
    environment:
      - TZ=Asia/Shanghai
    # CLI 模式默认启动（--ui 会尝试打开服务器本地浏览器，容器内无浏览器故不启用）
    command: ["--port=8080"]
